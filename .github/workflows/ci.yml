name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  linux:
    uses: ./.github/workflows/run-tests.yml
    with:
      os: ubuntu-latest

  windows:
    uses: ./.github/workflows/run-tests.yml
    with:
      os: windows-latest

  macos:
    uses: ./.github/workflows/run-tests.yml
    with:
      os: macos-latest
