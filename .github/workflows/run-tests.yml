on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

jobs:
  test:
    name: ${{ matrix.vscode-version }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        vscode-version: [stable, insiders]
    env:
      VSCODE_VERSION: ${{ matrix.vscode-version }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm ci

      - run: pnpm run build

      - run: pnpm run typecheck

      - name: Run tests
        run: ${{ runner.os == 'Linux' && 'dbus-run-session -- xvfb-run' || '' }} pnpm run test
